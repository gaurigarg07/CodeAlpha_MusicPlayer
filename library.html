<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAY | Your Library</title>
    <link rel="stylesheet" href="library.css">
</head>
<body>

    <header class="library-header">
        <a href="index.html" class="back-link">← Back to Home</a>
        <h1>Your Library</h1>
        <p>Your music, your mood, your SWAY.</p>
    </header>

    <main class="library-container">

        <section class="library-section">
            <h2>Made for You</h2>
            <div id="made-for-you-list" class="library-grid"></div>
        </section>

        <section class="library-section">
            <h2>Liked Songs ♡</h2>
            <div id="liked-songs-list" class="library-grid"></div>
        </section>

        <section class="library-section">
            <h2>Recently Played</h2>
            <div id="recently-played-list" class="library-grid"></div>
        </section>

        <section class="library-section">
            <h2>Your Playlists</h2>
            <div id="your-playlists-list" class="library-grid"></div>
        </section>

    </main>

    <script src="library.js"></script>
</body>
</html>
